<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5fa5">
<link rel="manifest" href="manifest.json">
<title>Fuente Nevada - Calculadora</title>
<style>
:root{--blue:#0b5fa5;--blue2:#1675c1;--bg:#f4f7fa;--card:#fff;--text:#142033;--muted:#6d7b8d;--line:#dce4ec}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:760px;margin:auto;padding:16px 14px 32px}
.header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px;border-radius:18px;box-shadow:0 8px 24px #0002;margin-bottom:14px}
.header h1{font-size:24px;margin:0 0 4px} .header small{opacity:.9}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 16px #0001;margin-bottom:12px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 6px}
select,input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qty{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.qty button{height:46px;border:0;border-radius:11px;font-size:25px;background:#e7f1fa;color:var(--blue);font-weight:700}
.qty input{text-align:center;font-weight:700}
.pricebox{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:#f0f6fb}
.pricebox strong{font-size:18px}
.primary,.secondary,.danger{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:#fff} .secondary{background:#e8f1f8;color:var(--blue)} .danger{background:#f7e9e9;color:#a11}
.item{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:8px}
.item:first-child{border-top:0} .item .meta{font-size:13px;color:var(--muted);margin-top:4px}
.item .amount{font-weight:800;font-size:18px;white-space:nowrap} .item button{border:0;background:none;color:#b22;font-size:13px;padding:5px 0}
.total{display:flex;justify-content:space-between;align-items:center;padding:15px 0 5px;font-size:23px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.badge{display:inline-block;background:#dff0ff;color:#07518e;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
@media(max-width:520px){.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Fuente Nevada</h1>
    <small>Calculadora de ventas</small>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <label>Lista de precio</label>
        <select id="lista">
          <option value="minorista">Minorista</option>
          <option value="mayorista">Mayorista</option>
        </select>
      </div>
      <div>
        <label>Modalidad</label>
        <select id="modalidad">
          <option>Ref</option>
          <option>Fac</option>
        </select>
      </div>
    </div>

    <label>Producto</label>
    <select id="producto"></select>

    <label>Cantidad</label>
    <div class="qty">
      <button type="button" id="menos">−</button>
      <input id="cantidad" type="number" min="1" step="1" value="1" inputmode="numeric">
      <button type="button" id="mas">+</button>
    </div>

    <div class="pricebox">
      <span>Precio unitario<br><span class="badge" id="tipoPrecio">Ref</span></span>
      <strong id="precio">$ 0,00</strong>
    </div>

    <div class="pricebox">
      <span>Subtotal</span>
      <strong id="subtotal">$ 0,00</strong>
    </div>

    <button class="primary" id="agregar" style="margin-top:12px">+ AGREGAR PRODUCTO</button>
  </div>

  <div class="card">
    <strong>Cuenta actual</strong>
    <div id="items" class="empty">Todavía no agregaste productos.</div>
    <div class="total"><span>TOTAL</span><span id="total">$ 0,00</span></div>
    <div class="actions">
      <button class="danger" id="nueva">Nueva cuenta</button>
    </div>
  </div>
</div>

<script>
const PRODUCTS = [{"name": "Agua Mineral 12 x 500cc", "minorista": {"Ref": 5500.0, "Fac": 6025.8}, "mayorista": {"Ref": 5100.0, "Fac": 5590.2}}, {"name": "Agua Mineral 6 x 1500cc", "minorista": {"Ref": 4300.0, "Fac": 4719.0}, "mayorista": {"Ref": 4000.0, "Fac": 4380.2}}, {"name": "Agua Mineral 6 x 2000cc", "minorista": {"Ref": 4500.0, "Fac": 4961.0}, "mayorista": {"Ref": 4200.0, "Fac": 4598.0}}, {"name": "Bidon Tradicional / G; 5L; POL X 28", "minorista": {"Ref": 35100.0, "Fac": 38478.0}, "mayorista": {"Ref": 29200.0, "Fac": 32065.0}}, {"name": "Bidon Liviano / V; 5L; POL X 28", "minorista": {"Ref": 32500.0, "Fac": 35695.0}, "mayorista": {"Ref": 27000.0, "Fac": 29645.0}}, {"name": "Bidon Recuperado; 5L; POL X 28", "minorista": {"Ref": 25800.0, "Fac": 28314.0}, "mayorista": {"Ref": 21500.0, "Fac": 23595.0}}, {"name": "Botella c/manija; 500cc; POL X 300", "minorista": {"Ref": 129640.0, "Fac": 142054.0}, "mayorista": {"Ref": 123200.0, "Fac": 134915.0}}, {"name": "Botella c/manija; 1000cc; POL X 150", "minorista": {"Ref": 90720.0, "Fac": 99341.0}, "mayorista": {"Ref": 86200.0, "Fac": 94380.0}}, {"name": "Botella Natural; 1000cc; POL X 120", "minorista": {"Ref": 90720.0, "Fac": 99341.0}, "mayorista": {"Ref": 86200.0, "Fac": 94380.0}}, {"name": "Bidon Tradicional / G; 10L; POL X 15", "minorista": {"Ref": 61600.0, "Fac": 67457.5}, "mayorista": {"Ref": 58520.0, "Fac": 64130.0}}, {"name": "Botellas C/PULL; 500cc; PET X 300", "minorista": {"Ref": 127750.0, "Fac": 139997.0}, "mayorista": {"Ref": 121400.0, "Fac": 133100.0}}, {"name": "Botellas T/COM; 500cc; PET X 300", "minorista": {"Ref": 120200.0, "Fac": 131648.0}, "mayorista": {"Ref": 114200.0, "Fac": 125114.0}}, {"name": "Botellas T/COM; 1500cc; PET X 120", "minorista": {"Ref": 57150.0, "Fac": 62617.5}, "mayorista": {"Ref": 54300.0, "Fac": 59471.5}}, {"name": "Botellas T/COM; 2000cc; PET X 120", "minorista": {"Ref": 66100.0, "Fac": 72479.0}, "mayorista": {"Ref": 62800.0, "Fac": 68849.0}}, {"name": "Tapas 28mm X 1", "minorista": {"Ref": 100.0, "Fac": 110.11}, "mayorista": {"Ref": 95.0, "Fac": 104.06}}, {"name": "Tapas de 5L X 1", "minorista": {"Ref": 300.0, "Fac": 329.12}, "mayorista": {"Ref": 285.0, "Fac": 314.6}}];
let cart = [];

const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2}).format(n);

function init(){
  PRODUCTS.forEach((p,i)=>{
    const o=document.createElement('option');
    o.value=i;o.textContent=p.name;$('producto').appendChild(o);
  });
  updatePrice();
}

function currentPrice(){
  const p=PRODUCTS[+$('producto').value];
  const list=$('lista').value;
  const mode=$('modalidad').value;
  return p[list][mode];
}

function qty(){
  const n=parseInt($('cantidad').value||'1',10);
  return Math.max(1,isNaN(n)?1:n);
}

function updatePrice(){
  $('cantidad').value=qty();
  const p=currentPrice();
  $('precio').textContent=money(p);
  $('subtotal').textContent=money(p*qty());
  $('tipoPrecio').textContent=$('modalidad').value;
}

['producto','lista','modalidad'].forEach(id=>$(id).addEventListener('change',updatePrice));
$('cantidad').addEventListener('input',updatePrice);
$('mas').onclick=()=>{$('cantidad').value=qty()+1;updatePrice()};
$('menos').onclick=()=>{$('cantidad').value=Math.max(1,qty()-1);updatePrice()};

$('agregar').onclick=()=>{
  const product=PRODUCTS[+$('producto').value];
  const list=$('lista').value;
  const mode=$('modalidad').value;
  const q=qty();
  const price=product[list][mode];
  cart.push({name:product.name,list,mode,qty:q,price,subtotal:q*price});
  render();
};

function render(){
  const box=$('items');
  if(!cart.length){
    box.className='empty';
    box.innerHTML='Todavía no agregaste productos.';
  } else {
    box.className='';
    box.innerHTML=cart.map((x,i)=>`
      <div class="item">
        <div>
          <strong>${x.name}</strong>
          <div class="meta">${x.list==='minorista'?'Minorista':'Mayorista'} · ${x.mode} · Cant.: ${x.qty} · ${money(x.price)} c/u</div>
          <button onclick="removeItem(${i})">Eliminar</button>
        </div>
        <div class="amount">${money(x.subtotal)}</div>
      </div>`).join('');
  }
  $('total').textContent=money(cart.reduce((a,x)=>a+x.subtotal,0));
}

window.removeItem=i=>{cart.splice(i,1);render()};

$('nueva').onclick=()=>{
  if(cart.length && !confirm('¿Borrar toda la cuenta?')) return;
  cart=[];
  $('lista').value='minorista';
  $('modalidad').value='Ref';
  $('producto').value='0';
  $('cantidad').value='1';
  updatePrice();
  render();
};


if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
init();
</script>
</body>
</html>
